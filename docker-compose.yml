version: '3.8'

services:
  app:
    build: .
    container_name: shortlink-app
    ports:
      - "8082:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      - CI_ENV=development

  db:
    image: mysql:5.7
    container_name: shortlink-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shortlink_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: shortlink-pma
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db

volumes:
  db_data: